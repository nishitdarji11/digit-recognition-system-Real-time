<!doctype html>
<html lang="en"></html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>  Digit Recognition System </title>
</head>
<body>
  <div class="container">
    <h1>  Digit Recognition System  (Realtime)</h1>

    <div class="tools">
      <label>Brush size: <input id="brush" type="range" min="6" max="40" value="24"></slabel>
      <button id="clear">Clear</button>
      <label class="toggle">
        <input id="rt" type="checkbox" checked> Realtime
      </label>
      <button id="predictBtn">Predict once</button>
    </div>

    <div class="stage">
      <canvas id="canvas" width="280" height="280"></canvas>
      <div class="panel">
        <div class="big">
          Prediction: <span id="pred">-</span>
        </div>
        <div id="bars" class="bars"></div>
      </div>
    </div>

    <p class="hint">Tip: Write a single digit (0–9). Use the Clear button to erase.</p>
  </div>

  
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
